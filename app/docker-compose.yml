name: nimbus-local

services:
  # ---------- SQL Server: stands in for Azure SQL, and stores Service Bus emulator data ----------
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------- Service Bus emulator: stands in for Azure Service Bus ----------
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      mssql:
        condition: service_healthy

  # ---------- Cosmos DB emulator: stands in for Azure Cosmos DB ----------
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    environment:
      PROTOCOL: http
      GATEWAY_PUBLIC_ENDPOINT: cosmos-emulator
    ports:
      - "1234:1234" # Data Explorer UI in your browser

  # ---------- Our services ----------
  orders-service:
    build: ./orders-service
    image: orders-service:local
    environment:
      SQL_SERVER: mssql
      SQL_DATABASE: ordersdb
      SQL_USER: sa
      SQL_PASSWORD: ${MSSQL_SA_PASSWORD}
      SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      SERVICEBUS_QUEUE: order-placed
    ports:
      - "8001:8000"
    depends_on:
      mssql:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started

  inventory-service:
    build: ./inventory-service
    image: inventory-service:local
    environment:
      COSMOS_ENDPOINT: "http://cosmos-emulator:8081/"
      # Public, well-known emulator key (documented by Microsoft). Not a real secret.
      COSMOS_KEY: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw=="
      COSMOS_DATABASE: nimbus
      COSMOS_CONTAINER: inventory
      SERVICEBUS_CONNECTION_STRING: "Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
      SERVICEBUS_QUEUE: order-placed
    ports:
      - "8002:8000"
    depends_on:
      - cosmos-emulator
      - servicebus-emulator

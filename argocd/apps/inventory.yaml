apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dev.azure.com/rahulraval/nimbus/_git/nimbus
    targetRevision: main
    path: helm/microservice
    helm:
      valueFiles:
        - ../../deploy/values-inventory.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nimbus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

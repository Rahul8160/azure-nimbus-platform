apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.serviceAccountName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    # Links this service account to the Azure managed identity
    azure.workload.identity/client-id: {{ required "values: 'workloadIdentity.clientId' is required" .Values.workloadIdentity.clientId | quote }}